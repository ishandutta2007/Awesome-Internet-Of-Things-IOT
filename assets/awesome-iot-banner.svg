<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .telemetry-line {
      stroke-dasharray: 8 12;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 5px; opacity: 0.6; }
      100% { r: 9px; opacity: 1; }
    }
    .ring-pulse {
      animation: ringExpand 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      transform-origin: center;
    }
    @keyframes ringExpand {
      0% { r: 10px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 45px; opacity: 0; stroke-width: 0.5px; }
    }
    .wave-flow {
      stroke-dasharray: 12 16;
      animation: waveFlow 12s linear infinite;
    }
    @keyframes waveFlow {
      from { stroke-dashoffset: 500; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Base Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly behind text) -->
  <g opacity="0.35">
    <!-- Ambient glowing backdrop blobs -->
    <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.12" />
    <circle cx="1050" cy="180" r="180" fill="#818cf8" filter="url(#glow)" opacity="0.15" />
    <circle cx="600" cy="300" r="120" fill="#c084fc" filter="url(#glow)" opacity="0.10" />

    <!-- Animated Telemetry Lines & Constellations -->
    <path class="telemetry-line" d="M -50 180 Q 200 60 450 180 T 950 160 T 1250 100" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="telemetry-line" d="M -50 280 Q 250 340 550 240 T 1050 280 T 1250 240" fill="none" stroke="#818cf8" stroke-width="1.2" />
    <path class="wave-flow" d="M 100 320 C 300 220 500 340 700 260 S 1100 200 1200 290" fill="none" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Right Side IoT Topology Constellation -->
    <g transform="translate(860, 40)">
      <!-- Topology Connection Lines -->
      <line x1="160" y1="120" x2="260" y2="60" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="160" y1="120" x2="240" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="160" y1="120" x2="70" y2="70" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="160" y1="120" x2="80" y2="190" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="260" y1="60" x2="240" y2="200" stroke="#475569" stroke-width="1" />

      <!-- Expanding radar waves around Central Broker Hub -->
      <circle cx="160" cy="120" r="15" fill="none" stroke="#38bdf8" class="ring-pulse" />
      <circle cx="160" cy="120" r="28" fill="none" stroke="#818cf8" class="ring-pulse" style="animation-delay: 1.5s;" />

      <!-- Central Gateway Node -->
      <circle cx="160" cy="120" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="160" cy="120" r="6" fill="#38bdf8" class="pulse-circle" />

      <!-- Peripheral Nodes (Edge Sensor, Actuator, Cloud, Database) -->
      <circle cx="260" cy="60" r="9" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="260" cy="60" r="4" fill="#818cf8" />

      <circle cx="240" cy="200" r="9" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <circle cx="240" cy="200" r="4" fill="#34d399" />

      <circle cx="70" cy="70" r="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2" />
      <circle cx="70" cy="70" r="3" fill="#fbbf24" />

      <circle cx="80" cy="190" r="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2" />
      <circle cx="80" cy="190" r="3" fill="#f43f5e" />

      <!-- Moving Telemetry Packets -->
      <circle r="3.5" fill="#38bdf8">
        <animateMotion path="M 160 120 L 260 60 L 160 120" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle r="3.5" fill="#34d399">
        <animateMotion path="M 80 190 L 160 120 L 240 200" dur="5s" repeatCount="indefinite" />
      </circle>
      <circle r="3.5" fill="#c084fc">
        <animateMotion path="M 70 70 L 160 120" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Highly readable, sharp typography with drop shadow -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge: Category Tag -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.8" filter="url(#shadow)">
      Awesome Internet of Things <tspan fill="url(#cyanPurple)">(IoT)</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Production SaaS Suites, Sovereign Open-Source Platforms, MQTT Brokers &amp; IIoT Middleware
    </text>

    <!-- Feature Feature Badges / Highlights in Foreground -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: Connectivity -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="69" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">📡 Device Fleets</text>
      </g>

      <!-- Badge 2: Ingestion & MQTT -->
      <g transform="translate(150, 0)">
        <rect width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="65" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ MQTT &amp; PubSub</text>
      </g>

      <!-- Badge 3: Telemetry & Dashboards -->
      <g transform="translate(292, 0)">
        <rect width="154" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="77" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#818cf8" text-anchor="middle">📊 Time-Series Data</text>
      </g>

      <!-- Badge 4: Edge & Firmware -->
      <g transform="translate(458, 0)">
        <rect width="152" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="76" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#34d399" text-anchor="middle">🛠️ Embedded &amp; Edge</text>
      </g>

      <!-- Badge 5: Industrial IoT -->
      <g transform="translate(622, 0)">
        <rect width="134" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="67" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#f59e0b" text-anchor="middle">🏭 Industry 4.0</text>
      </g>
    </g>

    <!-- Bottom Metadata Highlights -->
    <g transform="translate(0, 290)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        ⭐ Verified Star Rankings • 💰 Transparent Pricing Tiers • 🔓 Sovereign Self-Hosted Stacks • 🌐 Continuous Updates
      </text>
    </g>
  </g>

  <!-- Sleek Accent Bottom Border Gradient -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#cyanPurple)" />
</svg>